# CI of the Go rewrite (agora-go/). The parity job builds the Kotlin reference
# from the same commit and replays every differential scenario against both.
name: agora-go

on:
  push:
    paths: ["agora-go/**", "src/**", ".github/workflows/agora-go.yml"]
  pull_request:
    paths: ["agora-go/**", "src/**", ".github/workflows/agora-go.yml"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agora-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agora-go/go.mod
          cache-dependency-path: agora-go/go.sum
      - run: test -z "$(gofmt -l cmd internal parity)"
      - run: go vet ./...
      - run: go test -race ./...
      # production runs with TZ=Europe/Paris: the same tests in that zone (daylight saving time)
      - run: go test ./...
        env:
          TZ: Europe/Paris

  parity:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: agora_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARITY_PG_EXTERNAL: "1"
      PARITY_RUN_DIR: /tmp/parity-run
      PARITY_REF_JAR: ${{ github.workspace }}/build/libs/agora-back-0.0.1.jar
      PARITY_ORACLE: "1"
      REFJAR_DIR: /tmp/refjar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Kotlin reference
        run: ./gradlew bootJar -x test --no-daemon
      - name: Extract the reference jar for the JVM oracle
        run: mkdir -p /tmp/refjar && cd /tmp/refjar && unzip -q ${{ github.workspace }}/build/libs/agora-back-0.0.1.jar
      - uses: actions/setup-go@v5
        with:
          go-version-file: agora-go/go.mod
          cache-dependency-path: agora-go/go.sum
      - name: Install redis and psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server postgresql-client
      - name: Oracle tests (Go vs JVM implementations)
        working-directory: agora-go
        env:
          ORACLE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: go test ./internal/... ./parity/oracle/
      - name: Oracle tests in the production zone (Europe/Paris)
        working-directory: agora-go
        env:
          ORACLE_JAVA_HOME: ${{ env.JAVA_HOME }}
          TZ: Europe/Paris
        run: go test -count=1 ./internal/... ./parity/oracle/
      - name: Start both backends
        working-directory: agora-go
        env:
          PARITY_JAVA: ${{ env.JAVA_HOME }}/bin/java
        run: ./parity/run.sh up
      - name: Differential scenarios
        working-directory: agora-go
        env:
          PARITY_JAVA: ${{ env.JAVA_HOME }}/bin/java
        run: mkdir -p parity/reports && ./parity/run.sh test -report parity/reports/parity.json
      - name: Differential scenarios of the environment profiles (ACME)
        working-directory: agora-go
        env:
          PARITY_JAVA: ${{ env.JAVA_HOME }}/bin/java
        run: |
          set -e
          for p in acme:S11 acme-gates-a:S11-gates-a acme-gates-b:S11-gates-b acme-health:S11-health; do
            profile=${p%%:*}; tag=${p##*:}
            echo "== profile $profile"
            PARITY_PROFILE=$profile ./parity/run.sh restart-ref
            PARITY_PROFILE=$profile ./parity/run.sh restart-go
            PARITY_PROFILE=$profile ./parity/run.sh test -tags "$tag" -report "parity/reports/parity-$profile.json"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: |
            agora-go/parity/reports/
            /tmp/parity-run/*.log
