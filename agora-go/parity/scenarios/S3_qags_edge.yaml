name: S3-qags-offset-equals-count
tags: [S3]
dbdiff: none
setup:
  sql:
    # exactly 20 accepted QaGs in th5 (the seed has one): page 2 starts at offset 20 = count, which is NOT beyond the end
    - "INSERT INTO qags (id, title, description, post_date, status, thematique_id, user_id, username) SELECT ('00000000-0000-4000-8000-' || lpad(to_hex(4096 + i), 12, '0'))::uuid, 'Bulk question ' || i, 'Description ' || i, timestamp '2026-09-01 12:00:00' + (i || ' minutes')::interval, 1, 'th0000000000000000000005', '00000000-0000-4000-9000-000000000001'::uuid, 'Bulk' FROM generate_series(1, 19) AS i"
steps:
  - {id: top-th5-1, path: "/v2/qags?filterType=top&pageNumber=1&thematiqueId={{seed.Thematique5}}", as: "{{seed.UserRegular1}}"}
  - {id: top-th5-2-offset-equals-count, path: "/v2/qags?filterType=top&pageNumber=2&thematiqueId={{seed.Thematique5}}", as: "{{seed.UserRegular1}}"}
  - {id: top-th5-3-beyond, path: "/v2/qags?filterType=top&pageNumber=3&thematiqueId={{seed.Thematique5}}", as: "{{seed.UserRegular1}}"}
  - {id: latest-th5-2-offset-equals-count, path: "/v2/qags?filterType=latest&pageNumber=2&thematiqueId={{seed.Thematique5}}", as: "{{seed.UserRegular1}}"}
  - {id: latest-th5-2-xml, path: "/v2/qags?filterType=latest&pageNumber=2&thematiqueId={{seed.Thematique5}}&mediaType=xml", as: "{{seed.UserRegular1}}"}
  - {id: top-unknown-thematique, path: "/v2/qags?filterType=top&pageNumber=1&thematiqueId=unknown", as: "{{seed.UserRegular1}}"}
  - {id: top-unknown-thematique-p2, path: "/v2/qags?filterType=top&pageNumber=2&thematiqueId=unknown", as: "{{seed.UserRegular1}}"}
  - {id: supporting-unknown-thematique, path: "/v2/qags?filterType=supporting&pageNumber=1&thematiqueId=unknown", as: "{{seed.UserRegular1}}"}
