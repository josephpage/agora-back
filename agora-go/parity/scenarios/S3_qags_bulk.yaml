name: S3-qags-bulk-pages
tags: [S3]
dbdiff: none
setup:
  sql:
    # 130 accepted QaGs (60 % in th1, the others spread over th2..th6), distinct post dates, 0..6 supporters (many ties)
    - "INSERT INTO qags (id, title, description, post_date, status, thematique_id, user_id, username) SELECT ('00000000-0000-4000-8000-' || lpad(to_hex(4096 + i), 12, '0'))::uuid, 'Bulk question ' || i, 'Description ' || i, timestamp '2026-09-01 12:00:00' + (i || ' minutes')::interval, 1, CASE WHEN i % 10 < 6 THEN 'th0000000000000000000001' ELSE 'th000000000000000000000' || (2 + i % 5) END, '00000000-0000-4000-9000-000000000001'::uuid, 'Bulk' FROM generate_series(1, 130) AS i"
    - "INSERT INTO supports_qag (id, qag_id, support_date, user_id) SELECT gen_random_uuid(), ('00000000-0000-4000-8000-' || lpad(to_hex(4096 + i), 12, '0'))::uuid, timestamp '2026-09-02 12:00:00' + (j || ' minutes')::interval, ('00000000-0000-4000-9000-0000000000' || lpad(to_hex(31 + j), 2, '0'))::uuid FROM generate_series(1, 130) AS i, generate_series(1, 6) AS j WHERE j <= i % 7"
    # open QaGs of UserRegular4 (visible in its supporting tab only), one of them supported by someone else
    - "INSERT INTO qags (id, title, description, post_date, status, thematique_id, user_id, username) SELECT ('00000000-0000-4000-8000-' || lpad(to_hex(8192 + i), 12, '0'))::uuid, 'Open ' || i, 'Open description ' || i, timestamp '2026-09-20 12:00:00' + (i || ' minutes')::interval, 0, 'th0000000000000000000002', '00000000-0000-4000-9000-000000000004'::uuid, 'Open author' FROM generate_series(1, 3) AS i"
