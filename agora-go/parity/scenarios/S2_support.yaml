name: S2-support-invalid-qag-status-5
tags: [S2]
dbdiff: step
setup:
  sql:
    - "UPDATE qags SET status = 5 WHERE id = '00000000-0000-4000-8000-000000000002'"
steps:
  # An exception inside AgoraQueue.executeTask leaves the user locked on the Kotlin side until it restarts
  # (class B-AGORAQUEUE, Go releases the lock): every user that makes Kotlin throw is used for that task only once.
  - {id: support-invalid-status, method: POST, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserProfile1}}"}
  - {id: support-already-supported-invalid-status, method: POST, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserRegular1}}"}
  - {id: unsupport-invalid-status, method: DELETE, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserRegular6}}"}
  - {id: unsupport-not-supported-invalid-status, method: DELETE, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserIdle}}"}
  - {id: details-invalid-status, path: "/qags/{{seed.QagAcceptedTransport}}", as: "{{seed.UserRegular1}}"}
  - {id: public-invalid-status, path: "/api/public/qags/{{seed.QagAcceptedTransport}}"}
  - {id: details-delete-invalid-status, method: DELETE, path: "/qags/{{seed.QagAcceptedTransport}}", as: "{{seed.UserRegular2}}"}
---
