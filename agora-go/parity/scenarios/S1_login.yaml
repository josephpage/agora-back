name: S1-login-after-signup
tags: [S1]
dbdiff: step
steps:
  - id: signup
    method: POST
    path: /signup
    headers: {User-Agent: "Agora/2.0 (Android 14)", fcmToken: "fcm-first", versionName: "2.0.1", versionCode: "20", platform: android, X-Forwarded-For: "203.0.113.9"}
    capture: {jwt: "$.jwtToken", loginToken: "$.loginToken", uid: "$.userId"}
  - id: login
    method: POST
    path: /login
    headers: {User-Agent: "Agora/2.0 (Android 14)", fcmToken: "fcm-second", versionName: "2.0.2", versionCode: "21", platform: android, X-Forwarded-For: "203.0.113.10"}
    body: {loginToken: "{{loginToken}}"}
    capture: {jwt2: "$.jwtToken"}
  - {id: profile-with-login-jwt, path: /profile, bearer: "{{jwt2}}"}
  - {id: profile-with-signup-jwt, path: /profile, bearer: "{{jwt}}"}
  - id: login-minimal-headers
    method: POST
    path: /login
    headers: {versionCode: "20", platform: android}
    body: {loginToken: "{{loginToken}}"}
  - id: login-removes-fcm-token
    method: POST
    path: /login
    headers: {versionCode: "20", platform: android, fcmToken: ""}
    body: {loginToken: "{{loginToken}}"}
  - id: login-xml
    method: POST
    path: "/login?mediaType=xml"
    headers: {versionCode: "20", platform: android}
    body: {loginToken: "{{loginToken}}"}
    compare: {body: status}
  - id: login-extra-body-fields
    method: POST
    path: /login
    headers: {versionCode: "20", platform: android}
    body: {loginToken: "{{loginToken}}", extra: [1, 2], other: {a: 1}}
  - id: login-latin1-headers
    method: POST
    path: /login
    headers: {versionCode: "20", platform: android, User-Agent: "Agora é ü", fcmToken: "tok é"}
    body: {loginToken: "{{loginToken}}"}
  - id: login-long-user-agent
    method: POST
    path: /login
    headers: {versionCode: "20", platform: android, User-Agent: ""}
    body: {loginToken: "{{loginToken}}"}
  - id: login-after-long-ua-still-ok
    method: POST
    path: /login
    headers: {versionCode: "20", platform: android}
    body: {loginToken: "{{loginToken}}"}
  - id: login-long-fcm
    method: POST
    path: /login
    headers: {versionCode: "20", platform: android, fcmToken: ""}
    body: {loginToken: "{{loginToken}}"}
