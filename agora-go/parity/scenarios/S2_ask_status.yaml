name: S2-ask-status-future-and-multiple-qags
tags: [S2]
dbdiff: none
setup:
  sql:
    - "UPDATE qags SET post_date = LOCALTIMESTAMP + interval '30 days' WHERE id = '00000000-0000-4000-8000-000000000022'"
    - "UPDATE qags SET post_date = LOCALTIMESTAMP - interval '400 days' WHERE id = '00000000-0000-4000-8000-000000000003'"
    - "UPDATE qags SET status = 5 WHERE id = '00000000-0000-4000-8000-000000000023'"
steps:
