name: S2-ask-status-after-insert-by-another-route
tags: [S2]
dbdiff: step
steps:
  - {id: before, path: /qags/ask_status, as: "{{seed.UserIdle}}"}
  - id: insert
    method: POST
    path: /qags
    as: "{{seed.UserIdle}}"
    body: {title: "t", thematiqueId: "{{seed.Thematique1}}", description: "d", author: "a"}
  - {id: after, path: /qags/ask_status, as: "{{seed.UserIdle}}"}
  - {id: other-user-unchanged, path: /qags/ask_status, as: "{{seed.UserRegular1}}"}
