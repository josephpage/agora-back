name: S2-ask-status-just-before-monday-10h
tags: [S2]
dbdiff: none
setup:
  sql:
    - "UPDATE qags SET post_date = date_trunc('week', LOCALTIMESTAMP) + interval '10 hours' - interval '1 second' WHERE user_id = '00000000-0000-4000-9000-000000000003' AND status IN (0, 1)"
steps:
  - {id: ask-status, path: /qags/ask_status, as: "{{seed.UserRegular3}}"}
