name: S2-feedback-insert-update-and-results
tags: [S2]
dbdiff: step
steps:
  # UserRegular1 already answered: the details fill the user feedback cache with the stored answer.
  - {id: details-before-as-answered-user, path: "/qags/{{seed.QagSelectedVideo}}", as: "{{seed.UserRegular1}}", compare: {ignore: ["$.response.responseDate"]}}
  - {id: details-before-as-unanswered-user, path: "/qags/{{seed.QagSelectedVideo}}", as: "{{seed.UserRegular5}}", compare: {ignore: ["$.response.responseDate"]}}
  - {id: first-feedback-helpful, method: POST, path: "/qags/{{seed.QagSelectedVideo}}/feedback", as: "{{seed.UserRegular5}}", body: {isHelpful: true}}
  - {id: details-answered-user-sees-new-results, path: "/qags/{{seed.QagSelectedVideo}}", as: "{{seed.UserRegular1}}", compare: {ignore: ["$.response.responseDate"]}}
  - {id: details-unanswered-user-still-sees-no-results, path: "/qags/{{seed.QagSelectedVideo}}", as: "{{seed.UserIdle}}", compare: {ignore: ["$.response.responseDate"]}}
  - {id: same-answer-again, method: POST, path: "/qags/{{seed.QagSelectedVideo}}/feedback", as: "{{seed.UserRegular5}}", body: {isHelpful: true}}
  - {id: changed-answer, method: POST, path: "/qags/{{seed.QagSelectedVideo}}/feedback", as: "{{seed.UserRegular5}}", body: {isHelpful: false}}
  - {id: details-answered-user-sees-changed-results, path: "/qags/{{seed.QagSelectedVideo}}", as: "{{seed.UserRegular2}}", compare: {ignore: ["$.response.responseDate"]}}
  - {id: public-has-no-feedback, path: "/api/public/qags/{{seed.QagSelectedVideo}}", compare: {ignore: ["$.response.responseDate"]}}
  - {id: update-existing-answer-of-seeded-user, method: POST, path: "/qags/{{seed.QagSelectedVideo}}/feedback", as: "{{seed.UserRegular6}}", body: {isHelpful: true}}
  - {id: details-after-update-of-seeded-user, path: "/qags/{{seed.QagSelectedVideo}}", as: "{{seed.UserRegular1}}", compare: {ignore: ["$.response.responseDate"]}}
---
