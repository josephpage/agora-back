name: S1-profile-post-insert-deletes-ask-date
tags: [S1]
dbdiff: step
setup:
  sql:
    - "DELETE FROM users_profile WHERE user_id = '00000000-0000-4000-9000-000000000001'"
    - "INSERT INTO demographic_info_ask_date (id, ask_date, user_id) VALUES ('aaaaaaaa-0000-4000-a000-000000000001', '2026-01-01 10:00:00', '00000000-0000-4000-9000-00000000000f')"
    - "INSERT INTO demographic_info_ask_date (id, ask_date, user_id) VALUES ('aaaaaaaa-0000-4000-a000-000000000002', '2026-02-01 10:00:00', '00000000-0000-4000-9000-00000000000f')"
steps:
  - {id: regular1-insert-removes-ask-date, method: POST, path: /profile, as: "{{seed.UserRegular1}}", body: {gender: "F", yearOfBirth: 1970}}
  - {id: idle-insert-removes-both-rows, method: POST, path: /profile, as: "{{seed.UserIdle}}", body: {}}
  - {id: regular2-update-keeps-ask-date, method: POST, path: /profile, as: "{{seed.UserRegular2}}", body: {gender: "A", yearOfBirth: 1999, department: "13"}}
  - {id: get-regular2, path: /profile, as: "{{seed.UserRegular2}}"}
  - {id: regular6-update-keeps-departments, method: POST, path: /profile, as: "{{seed.UserRegular6}}", body: {gender: "M"}}
  - {id: get-regular6, path: /profile, as: "{{seed.UserRegular6}}"}
  - {id: regular7-update-all-null-row, method: POST, path: /profile, as: "{{seed.UserRegular7}}", body: {cityType: "R"}}
  - {id: get-regular7, path: /profile, as: "{{seed.UserRegular7}}"}
  - {id: invalid-row-update, method: POST, path: /profile, as: "{{seed.UserProfileInvalid}}", body: {gender: "F"}}
  - {id: get-invalid-row, path: /profile, as: "{{seed.UserProfileInvalid}}"}
---
# Kotlin quirk: POST /profile/departments writes with native SQL and leaves the
# 1h "profileCache" entry written by the previous POST /profile; the next profile
# update starts from that stale entry and erases the departments.
name: S1-profile-stale-cache-quirk
tags: [S1]
dbdiff: step
steps:
  - {id: insert, method: POST, path: /profile, as: "{{seed.UserIdle}}", body: {gender: "M", yearOfBirth: 1980}}
  - {id: departments, method: POST, path: /profile/departments, as: "{{seed.UserIdle}}", body: {departments: ["Paris", "Nord"]}}
  - {id: get-with-departments, path: /profile, as: "{{seed.UserIdle}}"}
  - {id: update-erases-departments, method: POST, path: /profile, as: "{{seed.UserIdle}}", body: {gender: "F", yearOfBirth: 1981}}
  - {id: get-departments-erased, path: /profile, as: "{{seed.UserIdle}}"}
  - {id: departments-again, method: POST, path: /profile/departments, as: "{{seed.UserIdle}}", body: {departments: ["Ain"]}}
  - {id: update-again, method: POST, path: /profile, as: "{{seed.UserIdle}}", body: {gender: "A"}}
  - {id: get-final, path: /profile, as: "{{seed.UserIdle}}"}
