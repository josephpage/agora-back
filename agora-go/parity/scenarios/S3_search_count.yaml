---
name: S3-search-after-support
tags: [S3]
dbdiff: step
steps:
  - {id: before, path: "/qags/search?keywords=transport", as: "{{seed.UserIdle}}"}
  - {id: support, method: POST, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserIdle}}"}
  # the supported flag is read at every request (the shared result of the search is not cached)
  - {id: after, path: "/qags/search?keywords=transport", as: "{{seed.UserIdle}}"}
  - {id: unsupport, method: DELETE, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserIdle}}"}
  - {id: after-unsupport, path: "/qags/search?keywords=transport", as: "{{seed.UserIdle}}"}
---
