---
name: S3-search-limit-twenty-and-unknown-thematique
tags: [S3]
dbdiff: none
setup:
  sql:
    - "INSERT INTO qags (id, title, description, post_date, status, thematique_id, user_id, username) SELECT ('00000000-0000-4000-8000-' || lpad(to_hex(4096 + i), 12, '0'))::uuid, 'Zebre question ' || i, 'Description ' || i, timestamp '2026-09-01 12:00:00' + (i || ' minutes')::interval, CASE WHEN i <= 30 THEN 1 ELSE 0 END, CASE WHEN i % 7 = 0 THEN 'unknown' ELSE 'th0000000000000000000001' END, '00000000-0000-4000-9000-000000000001'::uuid, 'Bulk' FROM generate_series(1, 40) AS i"
    - "INSERT INTO supports_qag (id, qag_id, support_date, user_id) SELECT gen_random_uuid(), ('00000000-0000-4000-8000-' || lpad(to_hex(4096 + i), 12, '0'))::uuid, timestamp '2026-09-02 12:00:00' + (j || ' minutes')::interval, ('00000000-0000-4000-9000-0000000000' || lpad(to_hex(31 + j), 2, '0'))::uuid FROM generate_series(1, 40) AS i, generate_series(1, 6) AS j WHERE j <= i % 7"
steps:
  - {id: more-than-twenty, path: "/qags/search?keywords=zebre", as: "{{seed.UserProfile3}}"}
  - {id: more-than-twenty-two-words, path: "/qags/search?keywords=zebre%20question", as: "{{seed.UserRegular1}}"}
  - {id: description-match, path: "/qags/search?keywords=Description", as: "{{seed.UserRegular1}}"}
  - {id: only-accepted, path: "/qags/search?keywords=Zebre%2035", as: "{{seed.UserRegular1}}"}
---
