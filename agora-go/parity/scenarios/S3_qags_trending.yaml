name: S3-trending-many-old-and-cluster-qags
tags: [S3]
dbdiff: none
setup:
  sql:
    # five more accepted QaGs: two of them old (80 h and 100 h: with the seed there are five QaGs older than 72 h, only three are kept)
    # and four whose title matches the "santé" cluster (used in a free-theme week)
    - "INSERT INTO qags (id, title, description, post_date, status, thematique_id, user_id, username) VALUES ('00000000-0000-4000-8000-000000001001', 'Ancienne question A', 'desc', '2026-09-20 10:00:00', 1, 'th0000000000000000000001', '00000000-0000-4000-9000-000000000001', 'Anna'), ('00000000-0000-4000-8000-000000001002', 'Ancienne question B', 'desc', '2026-09-20 11:00:00', 1, 'th0000000000000000000002', '00000000-0000-4000-9000-000000000001', 'Ben'), ('00000000-0000-4000-8000-000000001003', 'Question sur la SANTÉ mentale', 'desc', '2026-10-05 10:00:00', 1, 'th0000000000000000000002', '00000000-0000-4000-9000-000000000001', 'Cleo'), ('00000000-0000-4000-8000-000000001004', 'Hôpital et santé publique', 'desc', '2026-10-05 11:00:00', 1, 'th0000000000000000000002', '00000000-0000-4000-9000-000000000002', 'Dan'), ('00000000-0000-4000-8000-000000001005', 'Les soins de santé primaires', 'desc', '2026-10-05 12:00:00', 1, 'th0000000000000000000002', '00000000-0000-4000-9000-000000000003', 'Eli'), ('00000000-0000-4000-8000-000000001006', 'Le climat et la santé', 'desc', '2026-10-05 13:00:00', 1, 'th0000000000000000000001', '00000000-0000-4000-9000-000000000003', 'Fay')"
    - "INSERT INTO qag_updates (id, moderated_date, qag_id, should_delete_flag, status, user_id) SELECT gen_random_uuid(), (now() at time zone 'utc') - (h || ' hours')::interval, id::uuid, 0, 1, '00000000-0000-4000-9000-00000000000b' FROM (VALUES ('00000000-0000-4000-8000-000000001001', 80), ('00000000-0000-4000-8000-000000001002', 100), ('00000000-0000-4000-8000-000000001003', 3), ('00000000-0000-4000-8000-000000001004', 4), ('00000000-0000-4000-8000-000000001005', 5), ('00000000-0000-4000-8000-000000001006', 6)) AS v(id, h)"
    - "INSERT INTO supports_qag (id, qag_id, support_date, user_id) SELECT gen_random_uuid(), q::uuid, now() at time zone 'utc', ('00000000-0000-4000-9000-0000000000' || lpad(to_hex(31 + j), 2, '0'))::uuid FROM (VALUES ('00000000-0000-4000-8000-000000001001', 9), ('00000000-0000-4000-8000-000000001002', 8), ('00000000-0000-4000-8000-000000001003', 7), ('00000000-0000-4000-8000-000000001004', 6), ('00000000-0000-4000-8000-000000001005', 5), ('00000000-0000-4000-8000-000000001006', 4)) AS v(q, n), generate_series(1, 9) AS j WHERE j <= n"
steps:
