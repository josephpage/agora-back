name: S3-trending-cluster-edge-keywords
tags: [S3]
dbdiff: none
setup:
  strapiOverrides:
    - {model: theme-hebdos, fixture: "variants/theme-hebdos.libre-current.json"}
    - model: cluster-semaine-libres
      data:
        # same id twice (they share a counter), accents and case, a keyword that matches nothing, an NBSP and a tab around the words
        - {id: 1, documentId: c1, titre: dup, keywords: "TRANSPORT, ferroviaire ,\tgare"}
        - {id: 2, documentId: c2, titre: dup, keywords: "écologie ,ÉNERGIE"}
        - {id: 3, documentId: c3, titre: other, keywords: "zzz"}
steps:
  - {id: clusters-edge, path: "/v2/qags?filterType=trending&pageNumber=1", as: "{{seed.UserRegular1}}"}
