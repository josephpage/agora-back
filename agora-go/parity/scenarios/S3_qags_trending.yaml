name: S3-trending-cache-and-overlay
tags: [S3]
dbdiff: step
steps:
  - {id: before, path: "/v2/qags?filterType=trending&pageNumber=1", as: "{{seed.UserIdle}}"}
  - {id: support, method: POST, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserIdle}}"}
  # the candidates (and their counts) are kept 5 minutes by Kotlin; the supported flag is read at every request
  - {id: after-support, path: "/v2/qags?filterType=trending&pageNumber=1", as: "{{seed.UserIdle}}"}
  - {id: other-user, path: "/v2/qags?filterType=trending&pageNumber=1", as: "{{seed.UserRegular5}}"}
  - {id: unsupport, method: DELETE, path: "/qags/{{seed.QagAcceptedTransport}}/support", as: "{{seed.UserIdle}}"}
  - {id: after-unsupport, path: "/v2/qags?filterType=trending&pageNumber=1", as: "{{seed.UserIdle}}"}
