---
name: S3-headers-variants
tags: [S3]
dbdiff: none
setup:
  strapiOverrides:
    - model: qa-g-headers-onglets
      data:
        # two current headers of the same tab: the most recent publication wins (ties keep the Strapi order)
        - {id: 1, documentId: qhA, titre: "Ancien", message: "m1", type: top, datetime_publication: "{{now-3d}}", createdAt: x, updatedAt: y, publishedAt: z}
        - {id: 2, documentId: qhB, titre: "Récent \"quoted\" & <b>html</b> 😀", message: "ligne 1\nligne 2 — é", type: top, datetime_publication: "{{now-1d}}", createdAt: x, updatedAt: y, publishedAt: z}
        - {id: 3, documentId: qhC, titre: "Futur", message: "m3", type: top, datetime_publication: "{{now+1d}}", createdAt: x, updatedAt: y, publishedAt: z}
        - {id: 4, documentId: qhD, titre: "Latest", message: "", type: latest, datetime_publication: "{{now-1h}}", createdAt: x, updatedAt: y, publishedAt: z}
        - {id: 5, documentId: qhE, titre: "Autre type", message: "m5", type: other, datetime_publication: "{{now-1h}}"}
        - {id: 6, documentId: qhF, titre: "Supporting", message: "m6", type: supporting, datetime_publication: "{{now-1m}}"}
steps:
  - {id: top, path: "/v2/qags?filterType=top&pageNumber=1", as: "{{seed.UserRegular1}}"}
  - {id: latest-empty-message, path: "/v2/qags?filterType=latest&pageNumber=1", as: "{{seed.UserRegular1}}"}
  - {id: supporting, path: "/v2/qags?filterType=supporting&pageNumber=1", as: "{{seed.UserRegular1}}"}
  - {id: trending-without-header, path: "/v2/qags?filterType=trending&pageNumber=1", as: "{{seed.UserRegular1}}"}
  - {id: top-xml, path: "/v2/qags?filterType=top&pageNumber=1&mediaType=xml", as: "{{seed.UserRegular1}}"}
---
name: S3-headers-publication-formats
tags: [S3]
dbdiff: none
setup:
  strapiOverrides:
    - model: qa-g-headers-onglets
      data:
        - {id: 1, documentId: qhA, titre: "T", message: "m", type: top, datetime_publication: [2020, 1, 2, 3, 4]}
        - {id: 2, documentId: qhB, titre: "T2", message: "m", type: latest, datetime_publication: "2020-01-02T03:04:05Z"}
        - {id: 3, documentId: qhC, titre: "T3", message: "m", type: supporting, datetime_publication: "2020-01-02"}
        - {id: 4, documentId: qhD, titre: "T4", message: "m", type: trending, datetime_publication: "2020-01-02T03:04:05.123456789"}
steps:
  - {id: top-array, path: "/v2/qags?filterType=top&pageNumber=1", as: "{{seed.UserRegular1}}"}
  - {id: latest-z, path: "/v2/qags?filterType=latest&pageNumber=1", as: "{{seed.UserRegular1}}"}
  - {id: supporting-date-only, path: "/v2/qags?filterType=supporting&pageNumber=1", as: "{{seed.UserRegular1}}"}
  - {id: trending-nanos, path: "/v2/qags?filterType=trending&pageNumber=1", as: "{{seed.UserRegular1}}"}
