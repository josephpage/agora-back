  - {id: duplicates-last-wins, method: POST, path: "/qags/{{seed.QagSelectedDocument}}/feedback", as: "{{seed.UserRegular4}}", bodyRaw: "{\"isHelpful\":false,\"isHelpful\":true}", contentType: application/json}
