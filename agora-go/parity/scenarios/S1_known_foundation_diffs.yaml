name: S1-known-foundation-diffs
tags: [S1]
skip: "foundation findings reported to the lead (not fixable in the S1 slice): (1) a validly signed JWT without a sub claim is a Kotlin NPE (500) but Go answers 401 (auth.JWT.Parse returns an empty subject); (2) every 415 (missing or unsupported Content-Type) carries the wrong Accept header (httpx.acceptForBodies; Spring sends application/xml;charset=UTF-8, text/xml;charset=UTF-8, application/json, application/*+xml;charset=UTF-8, application/*+json); (3) a 406 (unknown ?mediaType) must not carry the handler's Set-Cookie header (already fixed on the lead's branch); (4) the 405 Allow header is joined with ', ' by Spring and with ',' by httpx"
