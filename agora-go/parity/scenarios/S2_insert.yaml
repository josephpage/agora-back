name: S2-insert-body-rejections
tags: [S2]
dbdiff: step
steps:
  - {id: missing-title, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {thematiqueId: "t", description: "d", author: "a"}}
  - {id: missing-thematique, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {title: "t", description: "d", author: "a"}}
  - {id: missing-description, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {title: "t", thematiqueId: "t", author: "a"}}
  - {id: missing-author, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {title: "t", thematiqueId: "t", description: "d"}}
  - {id: null-title, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {title: null, thematiqueId: "t", description: "d", author: "a"}}
  - {id: object-title, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {title: {a: 1}, thematiqueId: "t", description: "d", author: "a"}}
  - {id: array-title, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {title: ["x"], thematiqueId: "t", description: "d", author: "a"}}
  - {id: empty-object, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: {}}
  - {id: array-body, method: POST, path: /qags, as: "{{seed.UserIdle}}", body: [1]}
  - {id: null-body, method: POST, path: /qags, as: "{{seed.UserIdle}}", bodyRaw: "null", contentType: application/json}
  - {id: empty-body, method: POST, path: /qags, as: "{{seed.UserIdle}}", bodyRaw: "", contentType: application/json}
  - {id: truncated-json, method: POST, path: /qags, as: "{{seed.UserIdle}}", bodyRaw: "{\"title\":", contentType: application/json}
  - {id: not-json, method: POST, path: /qags, as: "{{seed.UserIdle}}", bodyRaw: "title=a&thematiqueId=b", contentType: application/json}
  - {id: trailing-garbage, method: POST, path: /qags, as: "{{seed.UserIdle}}", bodyRaw: "{\"title\":\"t\",\"thematiqueId\":\"t\",\"description\":\"d\",\"author\":\"a\"} trailing", contentType: application/json}
  - {id: details-nothing-inserted, path: /qags/ask_status, as: "{{seed.UserIdle}}"}
