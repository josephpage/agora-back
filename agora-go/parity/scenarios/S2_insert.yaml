name: S2-insert-success-then-weekly-limit
tags: [S2]
dbdiff: step
steps:
  - {id: ask-status-before, path: /qags/ask_status, as: "{{seed.UserRegular1}}"}
  - id: insert
    method: POST
    path: /qags
    as: "{{seed.UserRegular1}}"
    body: {title: "Pourquoi les trains sont-ils en retard ?", thematiqueId: "{{seed.Thematique4}}", description: "Une description de la question", author: "Camille"}
    capture: {qagId: "$.qagId"}
  - {id: details-as-author, path: "/qags/{{qagId}}", as: "{{seed.UserRegular1}}"}
  - {id: details-as-other, path: "/qags/{{qagId}}", as: "{{seed.UserRegular4}}"}
  - {id: details-as-moderator, path: "/qags/{{qagId}}", as: "{{seed.UserModerator}}"}
  - {id: details-anonymous, path: "/qags/{{qagId}}", compare: {ignore: ["$.path"]}}
  - {id: public-open-qag, path: "/api/public/qags/{{qagId}}"}
  - {id: ask-status-after, path: /qags/ask_status, as: "{{seed.UserRegular1}}"}
  - id: insert-again
    method: POST
    path: /qags
    as: "{{seed.UserRegular1}}"
    body: {title: "Deuxième question", thematiqueId: "{{seed.Thematique1}}", description: "d", author: "Camille"}
  - {id: unsupport-own-support, method: DELETE, path: "/qags/{{qagId}}/support", as: "{{seed.UserRegular1}}"}
  - {id: details-after-unsupport, path: "/qags/{{qagId}}", as: "{{seed.UserRegular1}}"}
  - {id: support-again, method: POST, path: "/qags/{{qagId}}/support", as: "{{seed.UserRegular1}}"}
  - {id: delete-the-new-qag, method: DELETE, path: "/qags/{{qagId}}", as: "{{seed.UserRegular1}}"}
  - {id: ask-status-after-delete, path: /qags/ask_status, as: "{{seed.UserRegular1}}"}
  - id: insert-after-delete
    method: POST
    path: /qags
    as: "{{seed.UserRegular1}}"
    body: {title: "Troisième question", thematiqueId: "{{seed.Thematique1}}", description: "d", author: "Camille"}
