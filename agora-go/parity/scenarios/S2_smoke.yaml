name: S2-smoke
tags: [S2smoke]
dbdiff: step
steps:
  - {id: details-accepted-as-regular1, path: "/qags/{{seed.QagAcceptedTop}}", as: "{{seed.UserRegular1}}"}
  - {id: details-selected-video, path: "/qags/{{seed.QagSelectedVideo}}", as: "{{seed.UserRegular1}}", compare: {ignore: ["$.response.responseDate"]}}
  - {id: public-selected, path: "/api/public/qags/{{seed.QagSelectedText}}", compare: {ignore: ["$.textResponse.responseDate"]}}
  - {id: ask-status, path: /qags/ask_status, as: "{{seed.UserRegular1}}"}
  - id: support
    method: POST
    path: "/qags/{{seed.QagAcceptedTop}}/support"
    as: "{{seed.UserRegular1}}"
  - {id: details-after-support, path: "/qags/{{seed.QagAcceptedTop}}", as: "{{seed.UserRegular1}}"}
